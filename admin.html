<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>後台｜放射科報告預計等候時間公告表</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>後台｜放射科報告預計等候時間</h1>
    <a class="btn" href="index.html">回前台</a>
  </header>
  <main>
    <section class="panel" id="login">
      <label for="pw">請輸入密碼</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button class="btn primary" id="login-btn" type="button">進入</button>
      <p class="msg err" id="login-msg"></p>
    </section>

    <section id="editor" hidden>
      <p class="meta">LastUpdate: <span id="last-update">—</span></p>
      <table class="board">
        <thead><tr><th>檢查類別</th><th>預計等候時間</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <section class="panel" id="ris-panel">
        <h2>上傳待報清單</h2>
        <p class="hint">檔案只在本機瀏覽器解析，不會上傳。</p>
        <label for="ris-file">RIS 匯出 .txt</label>
        <input id="ris-file" type="file" accept=".txt">
        <label for="ris-date">擷取日</label>
        <input id="ris-date" type="date">
        <p class="msg" id="ris-msg"></p>
        <div id="ris-result" hidden>
          <p id="ris-summary"></p>
          <table class="board" id="ris-preview">
            <thead><tr><th>類別</th><th>未打件數</th><th>最長天數</th><th>顯示標籤</th></tr></thead>
            <tbody id="ris-rows"></tbody>
          </table>
          <details><summary>未分類項目（名稱＋件數）</summary><ul id="ris-unclassified"></ul></details>
          <details><summary>各類命中項目（名稱＋件數）</summary><div id="ris-matched"></div></details>
        </div>
      </section>
      <div class="actions">
        <button class="btn primary" id="save-btn" type="button">儲存</button>
        <button class="btn secondary" id="reload-btn" type="button">重新載入</button>
        <button class="btn secondary" id="download-btn" type="button">下載每日等待時間分析.csv</button>
      </div>
      <p class="msg" id="save-msg"></p>
    </section>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
